name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find the project folder
        id: loc
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n 1)")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK (downloads three.js once and packs it into the app)
        run: gradle --no-daemon -p "${{ steps.loc.outputs.dir }}" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Redline-Pursuit-APK
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
