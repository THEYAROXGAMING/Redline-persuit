name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find (or unpack) the project
        id: loc
        run: |
          find_proj() { find . -name settings.gradle -not -path './.git/*' | head -n 1; }
          P=$(find_proj)
          if [ -z "$P" ]; then
            echo "No settings.gradle in the repository - looking for an uploaded .zip..."
            find . -iname '*.zip' -not -path './.git/*' -print0 | while IFS= read -r -d '' z; do echo "Unpacking $z"; unzip -o -q "$z" -d unpacked; done
            P=$(find_proj)
          fi
          if [ -z "$P" ]; then
            echo "::error::The Gradle project files are not in this repository. Upload the CONTENTS of the unzipped project (settings.gradle, build.gradle, app/ ...) or the .zip itself."
            echo "Files currently in the repository:"
            find . -not -path './.git/*' -type f | head -n 50
            exit 1
          fi
          DIR=$(dirname "$P")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK (downloads three.js once and packs it into the app)
        run: gradle --no-daemon -p "${{ steps.loc.outputs.dir }}" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Redline-Pursuit-APK
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
